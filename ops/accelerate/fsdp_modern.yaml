# Accelerate launch config for the modern venv (torch 2.7.1 / transformers 5.9).
#
# FSDP v1, FULL_SHARD across 4xH100. Deliberate choices:
#  - fsdp_activation_checkpointing: the quasar remote-code stubs out
#    transformers' GradientCheckpointingLayer, so the model's own
#    gradient_checkpointing_enable() is a silent no-op. FSDP-side activation
#    checkpointing wraps the decoder-layer instances externally and works for
#    any architecture.
#  - fsdp_use_orig_params: required so the patched loss forward can read
#    lm_head.weight (cut-cross-entropy) while the root unit is unsharded.
#  - transformer wrap class is NOT pinned here: train_chat_modern.py detects
#    the decoder-layer class at runtime (quasar/qwen/MoE generic) and sets
#    fsdp_plugin.transformer_cls_names_to_wrap before prepare().
#  - fsdp_cpu_ram_efficient_loading off: every rank loads the full checkpoint
#    (~440GB host RAM available), avoiding meta-device + remote-code edge cases.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
fsdp_config:
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: false
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: false
  fsdp_use_orig_params: true
